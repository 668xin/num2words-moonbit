name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: moon test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pin macOS explicitly: `macos-latest` repeatedly queued without a
        # runner and was cancelled after 15 minutes, while Linux/Windows ran.
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Show MoonBit version
        run: moon version

      - name: Run tests
        run: moon test

      - name: Check types
        run: moon check

      - name: Smoke test examples and CLI
        run: |
          moon run examples
          moon run cmd/main -- 1234 --lang en
          moon run cmd/main -- 2024 --lang ja --to year
          moon run cmd/main -- 1234.56 --lang zh --to currency
